name: Deploy

# Reusable Fly.io production deploy shared by Fly Deploy (push to main) and Release.
# Builds the image remotely, then smoke-tests /health and /, asserting the deployed revision (and version, if given).
on:
  workflow_call:
    inputs:
      image-label:
        description: Fly image label (e.g. main-abc1234 or v1.2.3)
        required: true
        type: string
      app-version:
        description: Release version baked into the build (APP_VERSION). Empty keeps the mix.exs default.
        required: false
        default: ""
        type: string
    secrets:
      FLY_API_TOKEN:
        required: false
    outputs:
      url:
        description: Public URL of the deployed app
        value: ${{ jobs.deploy.outputs.url }}
      version:
        description: Version reported by /health after the deploy
        value: ${{ jobs.deploy.outputs.version }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency: deploy-group
    environment:
      name: production
      url: https://marknotes.fly.dev
    outputs:
      url: ${{ steps.smoke.outputs.url }}
      version: ${{ steps.smoke.outputs.version }}
    env:
      APP_URL: https://marknotes.fly.dev
      IMAGE_LABEL: ${{ inputs.image-label }}
      APP_VERSION: ${{ inputs.app-version }}
    steps:
      - name: Preflight
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=Missing FLY_API_TOKEN::The FLY_API_TOKEN secret is not set. Create one with 'fly tokens create deploy -a marknotes' and add it as a repository secret (see README > Deployment and release)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          args=(--remote-only --ha=false --image-label "$IMAGE_LABEL" --build-arg "GIT_SHA=$GITHUB_SHA")
          if [ -n "$APP_VERSION" ]; then args+=(--build-arg "APP_VERSION=$APP_VERSION"); fi
          flyctl deploy "${args[@]}"

      - name: Smoke test
        id: smoke
        run: |
          # Machines auto-stop, so the first requests may hit a cold start.
          ok=""
          for attempt in $(seq 1 12); do
            if health=$(curl --silent --show-error --fail --max-time 15 "$APP_URL/health"); then
              revision=$(jq -r '.revision // empty' <<< "$health")
              version=$(jq -r '.version // empty' <<< "$health")
              if [ "$revision" = "$GITHUB_SHA" ] && { [ -z "$APP_VERSION" ] || [ "$version" = "$APP_VERSION" ]; }; then
                ok=1
                break
              fi
              echo "Attempt $attempt: /health reports revision '$revision', version '$version'; waiting for the new release."
            else
              echo "Attempt $attempt: /health not reachable yet."
            fi
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error title=Smoke test failed::$APP_URL/health did not report revision $GITHUB_SHA${APP_VERSION:+ and version $APP_VERSION}."
            exit 1
          fi
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 \
            --output /dev/null "$APP_URL/"
          echo "DEPLOYED_VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "url=$APP_URL"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Smoke test passed: $health"

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Fly.io deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| URL | <$APP_URL> |"
            echo "| Image label | \`$IMAGE_LABEL\` |"
            echo "| Version | \`${DEPLOYED_VERSION:-${APP_VERSION:-unverified}}\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Status | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
