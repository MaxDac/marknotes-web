name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Legacy required labels remain until an explicitly authorized ruleset migration.
  # These are real replacement checks, not compatibility no-ops.
  elixir:
    name: Elixir (compile, format, credo, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: assets
    env:
      GIT_SHA: ${{ github.sha }}
      APP_VERSION: 0.0.0-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Install pinned sync source-build tooling
        run: sh deploy/install-sync-toolchain.sh
        working-directory: .
      - run: npm ci
      - run: npm run build
      - name: Install pinned Caddy
        run: sh deploy/install-caddy.sh "$RUNNER_TEMP/caddy" && echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
        working-directory: .
      - name: Static hosting contracts (replacement for Phoenix tests)
        run: npm run contracts

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Caddy
        run: sh deploy/install-caddy.sh "$RUNNER_TEMP/caddy" && echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
      - name: Validate production server configuration (replacement for BEAM analysis)
        run: caddy validate --config Caddyfile --adapter caddyfile
      - name: Check container shell scripts
        run: shellcheck deploy/*.sh

  audit:
    name: Dependencies (audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: npm audit --audit-level=high
        working-directory: assets

  assets:
    name: Assets (prettier, tsc, eslint, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Install pinned sync source-build tooling
        run: sh deploy/install-sync-toolchain.sh
        working-directory: .
      - run: npm ci
      - run: npm run check
      - name: Unit test coverage (ratcheting thresholds in vitest.config.ts)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  parity:
    name: Parity (marknotes-spec fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Install pinned sync source-build tooling
        run: sh deploy/install-sync-toolchain.sh
        working-directory: .
      - run: npm ci
      - run: npm run parity

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Install pinned sync source-build tooling
        run: sh deploy/install-sync-toolchain.sh
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install pinned Caddy
        run: sh deploy/install-caddy.sh "$RUNNER_TEMP/caddy" && echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"
        working-directory: .
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            assets/playwright-report
            assets/test-results
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: marknotes:test
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=0.0.0-contract
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime configuration and image contracts
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: sh deploy/test-container.sh marknotes:test "$EXPECTED_REVISION" 0.0.0-contract
