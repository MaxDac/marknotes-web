version: 2
updates:
  - package-ecosystem: npm
    directory: /assets
    schedule:
      interval: weekly
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Bumps the marknotes-spec pin in spec/; the Parity job then runs the new fixtures.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
