name: Deploy

# Reusable Fly.io production deploy shared by Fly Deploy (push to main) and Release.
# Builds remotely, verifies health metadata/routes and checks the actual resource inventory.
on:
  workflow_call:
    inputs:
      image-label:
        description: Fly image label (e.g. main-abc1234 or v1.2.3)
        required: true
        type: string
      app-version:
        description: Release version baked into the build (APP_VERSION). Empty keeps the assets/package.json default.
        required: false
        default: ""
        type: string
    secrets:
      FLY_API_TOKEN:
        required: false
    outputs:
      url:
        description: Public URL of the deployed app
        value: ${{ jobs.deploy.outputs.url }}
      version:
        description: Version reported by /health after the deploy
        value: ${{ jobs.deploy.outputs.version }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency: deploy-group
    environment:
      name: production
      url: https://marknotes.fly.dev
    outputs:
      url: ${{ steps.smoke.outputs.url }}
      version: ${{ steps.smoke.outputs.version }}
    env:
      APP_NAME: marknotes
      APP_URL: https://marknotes.fly.dev
      PRIMARY_REGION: ams
      IMAGE_LABEL: ${{ inputs.image-label }}
      APP_VERSION: ${{ inputs.app-version }}
    steps:
      - name: Preflight
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error title=Missing FLY_API_TOKEN::The FLY_API_TOKEN secret is not set. Create one with 'fly tokens create deploy -a marknotes' and add it as a repository secret (see README > Deployment and release)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Resolve expected version
        run: |
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(jq -er '.version | select(type == "string" and length > 0)' assets/package.json)
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          args=(--app "$APP_NAME" --remote-only --ha=false --image-label "$IMAGE_LABEL"
            --build-arg "GIT_SHA=$GITHUB_SHA" --build-arg "APP_VERSION=$APP_VERSION")
          flyctl deploy "${args[@]}"

      - name: Verify minimum-resource inventory
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list --app "$APP_NAME" --json | jq -e --arg region "$PRIMARY_REGION" '
            length == 1 and all(.[];
              .region == $region and .config.guest.cpu_kind == "shared" and
              .config.guest.cpus == 1 and .config.guest.memory_mb == 256 and
              ((.config.mounts // []) | length == 0))'
          flyctl volumes list --app "$APP_NAME" --json | jq -e 'length == 0'
          flyctl ips list --app "$APP_NAME" --json | jq -e '
            any(.[]; .Type == "shared_v4") and any(.[]; .Type == "v6") and
            all(.[]; .Type == "shared_v4" or .Type == "v6")'

      - name: Smoke test
        id: smoke
        run: |
          # Machines auto-stop, so the first requests may hit a cold start.
          ok=""
          for attempt in $(seq 1 12); do
            if health=$(curl --silent --show-error --fail --max-time 15 "$APP_URL/health"); then
              revision=$(jq -r '.revision // empty' <<< "$health")
              version=$(jq -r '.version // empty' <<< "$health")
              status=$(jq -r '.status // empty' <<< "$health")
              if [ "$status" = "ok" ] && [ "$revision" = "$GITHUB_SHA" ] && [ "$version" = "$APP_VERSION" ]; then
                ok=1
                break
              fi
              echo "Attempt $attempt: /health reports status '$status', revision '$revision', version '$version'; waiting for the new release."
            else
              echo "Attempt $attempt: /health not reachable yet."
            fi
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error title=Smoke test failed::$APP_URL/health did not report revision $GITHUB_SHA${APP_VERSION:+ and version $APP_VERSION}."
            exit 1
          fi
          curl --silent --show-error --fail --retry 5 --retry-all-errors --retry-delay 5 --max-time 20 \
            --output /dev/null "$APP_URL/"
          for path in /config.json /sw.js /security /oauth/dropbox /oauth/onedrive /site.webmanifest; do
            curl --silent --show-error --fail --max-time 20 --output /dev/null "$APP_URL$path"
          done
          for path in /missing /assets/missing.js /oauth/unknown /live; do
            status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$APP_URL$path")
            if [ "$status" != 404 ]; then
              echo "::error::Expected 404 for $path, got $status."
              exit 1
            fi
          done
          echo "DEPLOYED_VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "url=$APP_URL"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Smoke test passed: $health"

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Fly.io deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| URL | <$APP_URL> |"
            echo "| Image label | \`$IMAGE_LABEL\` |"
            echo "| Version | \`${DEPLOYED_VERSION:-${APP_VERSION:-unverified}}\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Status | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
