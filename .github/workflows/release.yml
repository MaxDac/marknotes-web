name: Release

# Manual release: runs the checks, tags vX.Y.Z, publishes a GitHub Release and deploys that commit to Fly.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (semver X.Y.Z, tagged as vX.Y.Z)
        required: true
        default: 0.1.0
        type: string
      prerelease:
        description: Mark the GitHub Release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a valid X.Y.Z semver."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: validate
    uses: ./.github/workflows/checks.yml

  release:
    name: Publish GitHub Release
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "MarkNotes Web $VERSION" \
            --generate-notes \
            "${flags[@]}"

  deploy:
    name: Deploy
    needs: [validate, release]
    uses: ./.github/workflows/deploy.yml
    with:
      image-label: v${{ needs.validate.outputs.version }}
      app-version: ${{ needs.validate.outputs.version }}
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
