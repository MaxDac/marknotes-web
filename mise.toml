# Runtime versions stay in .tool-versions, shared with CI.
[tasks.setup]
description = "Install locked frontend dependencies and build the static app"
run = ["npm --prefix assets ci", "npm --prefix assets run build"]

[tasks.build]
description = "Build the portable static app"
run = "npm --prefix assets run build"

[tasks.dev]
description = "Run the Vite development server"
run = "npm --prefix assets run dev"

[tasks.check]
description = "Run frontend formatting, types, lint and unit tests"
run = "npm --prefix assets run check"

[tasks.audit]
description = "Audit frontend dependencies"
run = "npm --prefix assets audit --audit-level=high"

[tasks.e2e]
description = "Build and test production static hosting (Caddy must be on PATH)"
depends = ["build"]
run = "npm --prefix assets run e2e"
