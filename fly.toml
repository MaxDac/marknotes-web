# fly.toml app configuration for MarkNotes Web.
# See https://fly.io/docs/reference/configuration/
#
# Stateless app (no database): notes live in the browser's IndexedDB.

app = 'marknotes'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
