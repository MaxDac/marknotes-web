name: Checks

# Reusable checks shared by PR CI, Fly Deploy and Release.
# Contract: mix (compile, format, credo, test, dialyzer, hex.audit, deps.audit, sobelow, assets.deploy) and assets/package.json
# scripts `check` (prettier + tsc + eslint + vitest), `parity` (marknotes-spec fixtures from the spec/ submodule)
# and `e2e` (Playwright, starts the server itself).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  elixir:
    name: Elixir (compile, format, credo, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix test --warnings-as-errors

  audit:
    name: Dependencies (audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Restore deps and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-test-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - name: Retired Hex packages
        run: mix hex.audit
      - name: Known vulnerabilities (mix_audit)
        run: mix deps.audit
      # Fails on any finding; false positives are documented in .sobelow-conf / `# sobelow_skip` comments.
      - name: Security scan (Sobelow)
        run: mix sobelow --config
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        working-directory: assets

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix compile

      - name: Build PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      # Saved separately so the PLT is cached even when dialyzer reports warnings.
      - name: Save PLT cache
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - run: mix dialyzer --format github

  assets:
    name: Assets (prettier, tsc, eslint, vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - run: npm ci
      - run: npm run check

  parity:
    name: Parity (marknotes-spec fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - run: npm ci
      # Runs every spec/fixtures file against the browser code; see assets/parity/fixtures.test.ts.
      - run: npm run parity

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: prod
      PORT: "4000"
      PHX_HOST: localhost
      # Throwaway key for the ephemeral CI server only.
      SECRET_KEY_BASE: e2e-only-secret-key-base-not-used-anywhere-else-0123456789abcdefghijkl
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Restore deps and build cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-prod-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-prod-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: npm ci
        working-directory: assets

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('assets/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: assets

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: assets

      - run: mix deps.get --only prod
      - run: mix compile
      - run: mix assets.deploy

      # Playwright starts `mix phx.server` itself (see assets/playwright.config.ts).
      - run: npm run e2e
        working-directory: assets

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            assets/playwright-report
            assets/test-results
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
